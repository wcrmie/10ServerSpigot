name: '${project.name}'
version: '${project.version}'
main: worm.me.Server
api-version: '1.21'
authors: [ worm, clem, Boolean ]
depend: [WorldGuard]
softdepend: [MessageHead]
commands:
  placetree:
    permission: admin
    usage: /<command>
  generateisland:
    permission: admin
    usage: /<command>
  handbook:
    description: opens the handbook
    usage: /<command>
  generators:
    alias: setgens, gens
    description: Allows the player to choose which blocks are generated for them every 10 seconds via a GUI.
    usage: /<command>
  rules:
    description: Displays the rules to the player.
    usage: /<command>
  sit:
    description: Makes the player sit.
    usage: /<command>
  setSkin:
    description: Opens the set skin GUI.
    usage: /<command>
  blockcount:
    description: Check or set the current block count
    usage: /<command> <integer>
    permission: 10VS.blockcount
  discord:
    description: Provides a link to the server's Discord.
    usage: /<command>
  expansionpercentage:
    description: Set the percentage of blocks needed for world border expansion
    usage: /<command> <float>
    permission: 10VS.expansionpercentage
  abilities:
    description: Opens the ability selection GUI for the player.
    usage: /<command>
  levels:
    description: Opens the levels GUI for the player.
    usage: /<command>
  lostTools:
    description: Returns the player's lost tools.
    usage: /<command>
  menu:
    description: Opens the main menu for the player.
    usage: /<command>
  profile:
    description: Opens the player's profile.
    usage: /<command> [Player]
  recipes:
    description: Opens the recipes GUI for the player.
    usage: /<command>
  resetworld:
    description: Initiates a complete world reset
    usage: /resetworld
    permission: 10VS.worldreset
  suicide:
    cooldown:
    description: Kills the player
    usage: /<command>
  toggleGens:
    description: Toggles the generator on or off
    usage: /<command>
  testannouncement:
    description: test announcement
    usage: /<command>
  hat:
    description: Switches your main hand and hat slots
    usage: /<command>
  structuresmake:
    usage: /structuresmake <x1> <y1> <z1> <x2> <y2> <z2> <name>
    description: Save a structure
    permission: 10VS.structuresmake
  structuresplace:
      usage: /structuresplace <name> <x> <y> <z>
      description: Place a saved structure
      permission: 10VS.structuresplace
  structureslist:
      usage: /structureslist
      description: List all saved structures
      permission: 10VS.structureslist
  structuresplacetype:
    usage: /structuresplacetype
    description: crates an island of given type in the world
    permission: 10VS.structuresplacetype
  givebook:
    usage: /<command>
    description: gives cleric book
    permission: 10VS.givebook
  structuresremove:
    usage: /structuresremove
    description: removes a structure file
    permission: 10VS.structuresremove
  setresettimer:
    description: Sets the world reset timer
    usage: /setresettimer <seconds>
    permission: 10VS.setresettimer
  spawntreasure:
    description: Spawns a treasure chest in the world
    usage: /spawntreasure
    permission: 10VS.spawntreasure
  setbordergrid:
    description: Sets a border grid cell
    usage: /setbordergrid <row> <col> <0|1>
    permission: 10VS.setbordergrid
  getbordergrid:
    description: Displays the current border grid
    usage: /getbordergrid
    permission: 10VS.getbordergrid