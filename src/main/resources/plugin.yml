name: '${project.name}'
version: '${project.version}'
main: worm.me.Server
api-version: '1.21'
authors: [ worm, clem, Boolean ]
depend: [WorldGuard]
softdepend: [SkinsRestorer]
commands:
  setVoice:
    description: Changes a player's voice and pitch for when their message is displayed above their head.
    usage: /<command> <integer> <double>
  setGens:
    description: Allows the player to choose which blocks are generated for them every 10 seconds via a GUI.
    usage: /<command>
  shout:
    description: Allows the player to send a message to everyone on the Server once every 5 minutes
    usage: /<command> <message>
  rules:
    description: Displays the rules to the player.
    usage: /<command>
  sit:
    description: Makes the player sit.
    usage: /<command>
  setSkin:
    description: Opens the set skin GUI.
    usage: /<command>
  blockcount:
    description: Check or set the current block count
    usage: /<command> <integer>
    permission: 10VS.blockcount
  expansionpercentage:
    description: Set the percentage of blocks needed for world border expansion
    usage: /<command> <float>
    permission: 10VS.expansionpercentage
  setCharLimit:
    description: Set the character limit for chat messages for a specific player
    usage: /<command> <Player> <integer>
    permission: 10VS.setCharLimit
  abilities:
    description: Opens the ability selection GUI for the player.
    usage: /<command>
  levels:
    description: Opens the levels GUI for the player.
    usage: /<command>
  lostTools:
    description: Returns the player's lost tools.
    usage: /<command>
  menu:
    description: Opens the main menu for the player.
    usage: /<command>
  islandspawn:
    description: spawns an island, name of island.
    usage: /<command> [string]
    permission: 10VS.islandspawn
  profile:
    description: Opens the player's profile.
    usage: /<command> [Player]
  rename:
    description: Rename held item.
    usage: /<command> <string>
    permission: 10VS.rename
  recipes:
    description: Opens the recipes GUI for the player.
    usage: /<command>
  resetworld:
    description: Initiates a complete world reset
    usage: /resetworld
    permission: 10VS.worldreset
  discord:
    description: Get the discord link
    usage: /discord
  suicide:
    description: Kills the player
    usage: /<command>
  toggleGens:
    description: Toggles the generator on or off
    usage: /<command>
  link:
    description: Links your minecraft account to your discord
    usage: /<command>
  testannouncement:
    description: test announcement
    usage: /<command>
  hat:
    description: Switches your main hand and hat slots
    usage: /<command>
  say:
    description: An alternative to just typing in chat like a normal person
    usage: /<command> <message>
  report:
    description: Open the report menu, or send a report in chat
    usage: /<command> <player>
  voicemute:
    description: Mute players who are abusing voice chat
    usage: /<command> <player>
    permission: 10VS.voicemute