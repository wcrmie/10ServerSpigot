name: 10ServerSpigot
version: '1.0-SNAPSHOT'
main: worm.me.Server
api-version: '1.21'
authors: [ worm, clem ]
depend: [WorldGuard]
softdepend: [SkinsRestorer]
commands:
  setVoice:
    description: Changes a player's voice and pitch for when their message is displayed above their head.
    usage: /<command> <integer> <double>
  setGens:
    description: Allows the player to choose which blocks are generated for them every 10 seconds via a GUI.
    usage: /<command>
  shout:
    description: Allows the player to send a message to everyone on the Server once every 15 minutes
    usage: /<command> <message>
  rules:
    description: Displays the rules to the player.
    usage: /<command>
  sit:
    description: Makes the player sit.
    usage: /<command>
  setSkin:
    description: Opens the set skin GUI.
    usage: /<command>
  blockcount:
    description: Check or set the current block count
    usage: /<command> <integer>
    permission: 10VS.blockcount
  expansionpercentage:
    description: Set the percentage of blocks needed for world border expansion
    usage: /<command> <float>
    permission: 10VS.expansionpercentage
  setCharLimit:
    description: Set the character limit for chat messages for a specific player
    usage: /<command> <Player> <integer>
    permission: 10VS.setCharLimit
  abilities:
    description: Opens the ability selection GUI for the player.
    usage: /<command>
  spawnchest:
    description: Spawns a treasure chest at a random location within the world border
    usage: /<command>
    permission: 10VS.treasureChestSpawn
  hats:
    description: Opens the hat selection GUI for the player, or sets their hat.
    usage: /<command> [integer]
  levels:
    description: Opens the levels GUI for the player.
    usage: /<command>
  lostTools:
    description: Returns the player's lost tools.
    usage: /<command>
  menu:
    description: Opens the main menu for the player.
    usage: /<command>
  islandspawn:
    description: spawns an island, name of island.
    usage: /<command> [string]
    permission: 10VS.islandspawn